apiVersion: velero.io/v1
kind: VolumeSnapshotLocation
metadata:
  name: openebs-zfs
  namespace: velero
spec:
  provider: openebs.io/zfspv-blockstore
  config:
    # Namespace containing the ZFS LocalPV custom resources.
    namespace: openebs

    # Object storage provider: aws or gcp.
    provider: aws
    bucket: <BUCKET_NAME>
    region: <AWS_REGION>

    # Optional object name and path prefixes.
    prefix: zfs
    backupPathPrefix: <BACKUP_PATH_PREFIX>

    # Optional number of incremental backups between full backups.
    incrBackupCount: "5"

    # Optional settings for S3-compatible object storage.
    # s3Url: https://s3.example.com
    # s3ForcePathStyle: "true"
    # profile: default
    # multiPartChunkSize: 64Mi
    # caCert: <BASE64_ENCODED_CA_CERT>
    # insecureSkipTLSVerify: "false"
