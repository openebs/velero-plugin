version: "2"

run:
  timeout: 10m
  issues-exit-code: 10

linters:
  default: none
  enable:
    - goconst
    - gosec
    - unparam
  settings:
    misspell:
      locale: US
    nakedret:
      max-func-lines: 20
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport # https://github.com/go-critic/go-critic/issues/845
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc
        - rangeValCopy
        - unnamedResult
        - hugeParam
        - sloppyReassign

formatters:
  enable:
    - gofmt
    - goimports
